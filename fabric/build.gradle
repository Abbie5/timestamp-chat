plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    xplat {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom xplat
    runtimeClasspath.extendsFrom xplat
    developmentFabric.extendsFrom xplat

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    // modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    xplat(project(path: ':xplat')) { transitive = false }
    shadowBundle project(path: ':xplat', configuration: 'transformProductionFabric')

    // Bundle the Fabric API modules we use so the mod works without the full Fabric API.
    // fabric-api-base is required by fabric-message-api-v1.
    include implementation(fabricApi.module("fabric-api-base", rootProject.fabric_api_version))
    include implementation(fabricApi.module("fabric-message-api-v1", rootProject.fabric_api_version))

    implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    implementation "com.terraformersmc:modmenu:${rootProject.mod_menu_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    zip64 = true
}

assemble.dependsOn shadowJar
